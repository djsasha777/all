---
- name: install openconnect
  hosts: localhost
  vars:
    ansible_user: root
  tasks:

    # --- Базовые пакеты ---
    - name: apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - gnutls-bin
          - apache2-utils
          - git
          - ruby-ronn
          - libbsd-dev
          - libsystemd-dev
          - libpcl-dev
          - libwrap0-dev
          - libgnutls28-dev
          - libev-dev
          - libpam0g-dev
          - liblz4-dev
          - libseccomp-dev
          - libreadline-dev
          - libnl-route-3-dev
          - libkrb5-dev
          - libradcli-dev
          - libcurl4-gnutls-dev
          - libcjose-dev
          - libjansson-dev
          - libprotobuf-c-dev
          - libtalloc-dev
          - libhttp-parser-dev
          - protobuf-c-compiler
          - gperf
          - nuttcp
          - lcov
          - libuid-wrapper
          - libpam-wrapper
          - libnss-wrapper
          - libsocket-wrapper
          - iputils-ping
          - freeradius
          - gawk
          - iproute2
          - yajl-tools
          - tcpdump
          - build-essential
          - meson
          - ninja-build
          - pkg-config
          - libtasn1-bin
        state: present

    # --- Системные настройки для маршрутизации ---
    - name: Enable IP forwarding (runtime)
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Enable IP forwarding (persist)
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^#?\s*net\.ipv4\.ip_forward'
        line: 'net.ipv4.ip_forward = 1'

    - name: Get default outbound interface for MASQUERADE
      ansible.builtin.command: ip route get 8.8.8.8
      register: default_route
      changed_when: false
      check_mode: no

    - name: Set external interface fact
      ansible.builtin.set_fact:
        external_iface: "{{ (default_route.stdout.split('dev ')[1]).split()[0] }}"

    - name: Check if NAT MASQUERADE rule exists
      ansible.builtin.command: iptables -t nat -C POSTROUTING -s {{ openconnect.ipNetwork }}/24 -o {{ external_iface }} -j MASQUERADE
      register: nat_rule_check
      ignore_errors: yes
      changed_when: false

    - name: Add NAT MASQUERADE rule
      ansible.builtin.command: iptables -t nat -A POSTROUTING -s {{ openconnect.ipNetwork }}/24 -o {{ external_iface }} -j MASQUERADE
      when: nat_rule_check.rc != 0

    - name: Install iptables-persistent to save rules
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
      when: ansible_os_family == "Debian"

    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save
      when: ansible_os_family == "Debian"

    # --- Сборка ocserv из исходников (оптимизировано) ---
    - name: Clone ocserv from GitLab (master)
      ansible.builtin.git:
        repo: https://gitlab.com/openconnect/ocserv.git
        dest: /usr/src/ocserv
        version: master
        force: yes

    - name: Setup meson build directory
      ansible.builtin.command: meson setup build --prefix=/usr
      args:
        chdir: /usr/src/ocserv
      creates: /usr/src/ocserv/build/meson-private

    - name: Build ocserv with ninja
      ansible.builtin.command: ninja -C build
      args:
        chdir: /usr/src/ocserv
      creates: /usr/src/ocserv/build/ocserv

    - name: Install ocserv
      ansible.builtin.command: ninja -C build install
      args:
        chdir: /usr/src/ocserv
      creates: /usr/sbin/ocserv

    - name: Ensure ocserv binary exists
      ansible.builtin.stat:
        path: /usr/sbin/ocserv
      register: ocserv_bin
      failed_when: not ocserv_bin.stat.exists

    # --- Сертификаты и конфигурация ---
    - name: Create openconnect config directory
      ansible.builtin.file:
        path: "/etc/openconnect"
        state: directory
        mode: "0755"

    - name: template ca template
      template: 
        src: templates/oc.ca.tmpl.j2
        dest: /etc/openconnect/oc.ca.tmpl
      notify:
        - reCa
        - restart ocserv

    - name: template server cert template
      template: 
        src: templates/oc.server.tmpl.j2
        dest: /etc/openconnect/oc.server.tmpl
      notify:
        - reCert
        - restart ocserv

    - name: Create ca key
      ansible.builtin.command:
        cmd: certtool --generate-privkey --outfile /etc/openconnect/ca-key.pem
        creates: "/etc/openconnect/ca-key.pem"

    - name: Create ca cert
      ansible.builtin.command:
        cmd: certtool --generate-self-signed --load-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.ca.tmpl --outfile /etc/openconnect/ca-cert.pem
        creates: "/etc/openconnect/ca-cert.pem"

    - name: Create server key
      ansible.builtin.command:
        cmd: certtool --generate-privkey --outfile /etc/openconnect/server-key.pem
        creates: "/etc/openconnect/server-key.pem"

    - name: Create server cert
      ansible.builtin.command:
        cmd: certtool --generate-certificate --load-privkey /etc/openconnect/server-key.pem --load-ca-certificate /etc/openconnect/ca-cert.pem --load-ca-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.server.tmpl --outfile /etc/openconnect/server-cert.pem
        creates: "/etc/openconnect/server-cert.pem"

    - name: Create ocserv config directory
      ansible.builtin.file:
        path: "/etc/ocserv"
        state: directory
        mode: "0755"

    - name: template config
      template: 
        src: templates/oc.config.j2
        dest: /etc/ocserv/ocserv.conf
      notify: restart ocserv

    # --- Systemd service ---
    - name: Create systemd service for ocserv
      ansible.builtin.copy:
        dest: /etc/systemd/system/ocserv.service
        mode: "0644"
        content: |
          [Unit]
          Description=OpenConnect VPN server
          After=network.target

          [Service]
          Type=forking
          ExecStart=/usr/sbin/ocserv -c /etc/ocserv/ocserv.conf
          ExecReload=/bin/kill -HUP $MAINPID
          PIDFile=/var/run/ocserv.pid
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: reload daemon

    - name: Ensure openconnect is enabled and started
      ansible.builtin.service:  
        name: ocserv
        state: started
        enabled: yes

  handlers:
    - name: reCa
      ansible.builtin.command:
        cmd: certtool --generate-self-signed --load-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.ca.tmpl --outfile /etc/openconnect/ca-cert.pem
      notify: restart ocserv

    - name: reCert
      ansible.builtin.command:
        cmd: certtool --generate-certificate --load-privkey /etc/openconnect/server-key.pem --load-ca-certificate /etc/openconnect/ca-cert.pem --load-ca-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.server.tmpl --outfile /etc/openconnect/server-cert.pem
      notify: restart ocserv

    - name: reload daemon
      ansible.builtin.command: systemctl daemon-reload

    - name: restart ocserv
      ansible.builtin.service:
        name: ocserv
        state: restarted
        enabled: yes
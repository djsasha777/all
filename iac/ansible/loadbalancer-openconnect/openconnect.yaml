---
- name: install openconnect
  hosts: localhost
  vars:
    ansible_user: root
  tasks:

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: install packages
      ansible.builtin.apt:
        name:
          - gnutls-bin
          - apache2-utils
          - git
          - ruby-ronn
          - libbsd-dev
          - libsystemd-dev
          - libpcl-dev
          - libwrap0-dev
          - libgnutls28-dev
          - libev-dev
          - libpam0g-dev
          - liblz4-dev
          - libseccomp-dev
          - libreadline-dev
          - libnl-route-3-dev
          - libkrb5-dev
          - libradcli-dev
          - libcurl4-gnutls-dev
          - libcjose-dev
          - libjansson-dev
          - libprotobuf-c-dev
          - libtalloc-dev
          - libhttp-parser-dev
          - protobuf-c-compiler
          - gperf
          - nuttcp
          - lcov
          - libuid-wrapper
          - libpam-wrapper
          - libnss-wrapper
          - libsocket-wrapper
          - iputils-ping
          - freeradius
          - gawk
          - iproute2
          - yajl-tools
          - tcpdump
          # build tools
          - build-essential
          - meson
          - ninja-build
          - pkg-config
          - libtasn1-bin
        state: present

    # --- Сборка ocserv из исходников ---
    # --- Сборка ocserv из официального GitLab-репо (master, meson) ---
    - name: Clone ocserv from GitLab (master)
      ansible.builtin.git:
        repo: https://gitlab.com/openconnect/ocserv.git
        dest: /usr/src/ocserv
        version: master
        force: yes

    - name: Install meson and ninja
      ansible.builtin.apt:
        name:
          - meson
          - ninja-build
        state: present

    - name: Setup meson build directory
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /usr/src/ocserv
          meson setup build --prefix=/usr
        creates: /usr/src/ocserv/build/meson-private

    - name: Build ocserv with ninja
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /usr/src/ocserv
          ninja -C build
        creates: /usr/src/ocserv/build/ocserv

    - name: Install ocserv
      ansible.builtin.shell:
        cmd: |
          set -e
          cd /usr/src/ocserv
          ninja -C build install
        creates: /usr/sbin/ocserv

    - name: Ensure ocserv binary exists
      ansible.builtin.stat:
        path: /usr/sbin/ocserv
      register: ocserv_bin
      failed_when: not ocserv_bin.stat.exists
    # --- Дальше твоя логика с сертификатами и конфигом ---
    - name: Create openconnect config directory
      ansible.builtin.file:
        path: "/etc/openconnect"
        state: directory
        mode: "0755"

    - name: template ca template
      template: 
        src: templates/oc.ca.tmpl.j2
        dest: /etc/openconnect/oc.ca.tmpl
      notify:
        - reCa
        - restart

    - name: template server cert template
      template: 
        src: templates/oc.server.tmpl.j2
        dest: /etc/openconnect/oc.server.tmpl
      notify:
        - reCert
        - restart

    - name: Create ca key
      ansible.builtin.command:
        cmd: >-
          certtool --generate-privkey --outfile /etc/openconnect/ca-key.pem
        creates: "/etc/openconnect/ca-key.pem"

    - name: Create ca cert
      ansible.builtin.command:
        cmd: >-
          certtool --generate-self-signed --load-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.ca.tmpl --outfile /etc/openconnect/ca-cert.pem
        creates: "/etc/openconnect/ca-cert.pem"

    - name: Create server key
      ansible.builtin.command:
        cmd: >-
          certtool --generate-privkey --outfile /etc/openconnect/server-key.pem
        creates: "/etc/openconnect/server-key.pem"

    - name: Create server cert
      ansible.builtin.command:
        cmd: >-
          certtool --generate-certificate --load-privkey /etc/openconnect/server-key.pem --load-ca-certificate /etc/openconnect/ca-cert.pem --load-ca-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.server.tmpl --outfile /etc/openconnect/server-cert.pem
        creates: "/etc/openconnect/server-cert.pem"

    - name: template config
      template: 
        src: templates/oc.config.j2
        dest: /etc/ocserv/ocserv.conf

    - name: reload demon
      ansible.builtin.command:
        cmd: >-
          systemctl daemon-reload

    - name: Ensure openconnect is stoped
      service:  
        name: ocserv
        state: stopped
        enabled: yes

    - name: Ensure openconnect is started
      service:  
        name: ocserv
        state: started
        enabled: yes

  handlers:
    - name: reCa
      ansible.builtin.command:
        cmd: >-
          certtool --generate-self-signed --load-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.ca.tmpl --outfile /etc/openconnect/ca-cert.pem

    - name: reCert
      ansible.builtin.command:
        cmd: >-
          certtool --generate-certificate --load-privkey /etc/openconnect/server-key.pem --load-ca-certificate /etc/openconnect/ca-cert.pem --load-ca-privkey /etc/openconnect/ca-key.pem --template /etc/openconnect/oc.server.tmpl --outfile /etc/openconnect/server-cert.pem

    - name: reDemon
      ansible.builtin.command:
        cmd: >-
          systemctl daemon-reload

    - name: restart
      service:  
        name: ocserv
        state: restarted
        enabled: yes

    - name: Check if NAT MASQUERADE rule exists
      ansible.builtin.command:
        cmd: iptables -t nat -S | grep -q "POSTROUTING -s {{ openconnect.ipNetwork }}/24 -o eth0 -j MASQUERADE"
      register: nat_rule_exists
      changed_when: false
      ignore_errors: yes

    - name: Add NAT MASQUERADE rule if missing
      ansible.builtin.command:
        cmd: iptables -t nat -A POSTROUTING -s {{ openconnect.ipNetwork }}/24 -o eth0 -j MASQUERADE
      when: nat_rule_exists.rc is defined and nat_rule_exists.rc != 0
---
- name: install shadowsocks
  hosts: localhost
  vars:
    ansible_user: root
  tasks:

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Add v2ray APT key
      ansible.builtin.apt_key:
        url: https://raw.githubusercontent.com/v2fly/v2ray-core/master/release/verifier_2023.asc
        state: present

    - name: Add v2ray repository
      ansible.builtin.apt_repository:
        repo: "deb https://repo.v2fly.org/deb {{ ansible_distribution_release }} stable"
        state: present
        filename: v2ray

    - name: apt update after adding repo
      ansible.builtin.apt:
        update_cache: yes

    - name: install shadowsocks and v2ray-plugin
      ansible.builtin.apt:
        name:
          - shadowsocks-libev
          - openssl
          - v2ray-plugin
        state: present

    - name: Ensure SSL directory exists
      ansible.builtin.file:
        path: /etc/shadowsocks-libev/ssl
        state: directory
        mode: '0755'

    - name: Check if certificate and key already exist
      ansible.builtin.stat:
        path: /etc/shadowsocks-libev/ssl/server.crt
      register: cert_stat

    - name: Generate self-signed certificate and key
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -keyout /etc/shadowsocks-libev/ssl/server.key
        -out /etc/shadowsocks-libev/ssl/server.crt -days 365 -nodes
        -subj "/CN={{ dnsName }}"
      args:
        creates: /etc/shadowsocks-libev/ssl/server.crt
      when: not cert_stat.stat.exists

    - name: Ensure shadowsocks conf is set
      template: 
        src: templates/ss.config.json.j2 
        dest: /etc/shadowsocks-libev/config.json

    - name: Ensure shadowsocks is restarted
      service:  
        name: shadowsocks-libev
        state: restarted
        enabled: yes
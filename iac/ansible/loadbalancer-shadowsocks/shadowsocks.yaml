---
- name: install shadowsocks with obfs and v2ray
  hosts: localhost
  vars:
    ansible_user: root
  tasks:

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: install shadowsocks and dependencies
      ansible.builtin.apt:
        name:
          - shadowsocks-libev
          - openssl
          - curl
        state: present

    # --- Установка v2ray-plugin ---
    - name: Get latest v2ray-plugin release info
      ansible.builtin.uri:
        url: https://api.github.com/repos/shadowsocks/v2ray-plugin/releases/latest
        return_content: yes
        headers:
          Accept: application/vnd.github.v3+json
      register: v2ray_release

    - name: Set v2ray-plugin version fact
      ansible.builtin.set_fact:
        v2ray_version: "{{ v2ray_release.json.tag_name }}"

    - name: Download v2ray-plugin
      ansible.builtin.get_url:
        url: "https://github.com/shadowsocks/v2ray-plugin/releases/download/{{ v2ray_version }}/v2ray-plugin-linux-amd64-{{ v2ray_version }}.tar.gz"
        dest: /tmp/v2ray-plugin.tar.gz
        mode: '0644'

    - name: Extract v2ray-plugin
      ansible.builtin.unarchive:
        src: /tmp/v2ray-plugin.tar.gz
        dest: /usr/local/bin
        remote_src: yes

    - name: Rename v2ray-plugin binary
      ansible.builtin.command: mv v2ray-plugin_linux_amd64 v2ray-plugin
      args:
        chdir: /usr/local/bin
        creates: /usr/local/bin/v2ray-plugin
        
    - name: Set executable permission on v2ray-plugin
      ansible.builtin.file:
        path: /usr/local/bin/v2ray-plugin
        mode: '0755'

    # --- Установка obfs-local (obfs4) ---
    - name: Install obfs4proxy from apt repository
      ansible.builtin.apt:
        name: obfs4proxy
        state: present

    # --- SSL директория ---
    - name: Ensure SSL directory exists
      ansible.builtin.file:
        path: /etc/shadowsocks-libev/ssl
        state: directory
        mode: '0755'

    # --- Сертификаты для v2ray ---
    - name: Check if v2ray certificate and key already exist
      ansible.builtin.stat:
        path: /etc/shadowsocks-libev/ssl/serverv2.crt
      register: cert_v2_stat

    - name: Generate self-signed certificate for v2ray
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -keyout /etc/shadowsocks-libev/ssl/serverv2.key
        -out /etc/shadowsocks-libev/ssl/serverv2.crt -days 365 -nodes
        -subj "/CN={{ dnsNameV2ray }}"
      args:
        creates: /etc/shadowsocks-libev/ssl/serverv2.crt
      when: not cert_v2_stat.stat.exists

    # --- Сертификаты для obfs (для совместимости с клиентами, ожидающими TLS на 443) ---
    - name: Check if obfs certificate and key already exist
      ansible.builtin.stat:
        path: /etc/shadowsocks-libev/ssl/serverobfs.crt
      register: cert_obfs_stat

    - name: Generate self-signed certificate for obfs
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -keyout /etc/shadowsocks-libev/ssl/serverobfs.key
        -out /etc/shadowsocks-libev/ssl/serverobfs.crt -days 365 -nodes
        -subj "/CN={{ dnsNameObfs }}"
      args:
        creates: /etc/shadowsocks-libev/ssl/serverobfs.crt
      when: not cert_obfs_stat.stat.exists

    - name: Set correct ownership for SSL files
      ansible.builtin.file:
        path: /etc/shadowsocks-libev/ssl
        recurse: yes
        mode: '0600' # Приватные ключи должны быть доступны только владельцу

    # --- Шаблон конфигурации (будет разделен на два файла задачами ниже) ---
    - name: Ensure shadowsocks obfs conf is set
      template: 
        src: templates/ss-obfs.config.json.j2 
        dest: /etc/shadowsocks-libev/obfs.json
      notify: Restart obfs ss service

    - name: Ensure shadowsocks v2ray conf is set
      template: 
        src: templates/ss-v2ray.config.json.j2 
        dest: /etc/shadowsocks-libev/v2ray.json
      notify: Restart v2ray ss service

  # --- Обработчики для двух разных сервисов ---
  handlers:
    - name: Restart obfs ss service
      ansible.builtin.service:
        name: shadowsocks-libev-obfs
        state: restarted
        enabled: yes

    - name: Restart v2ray ss service
      ansible.builtin.service:
        name: shadowsocks-libev-v2ray
        state: restarted
        enabled: yes
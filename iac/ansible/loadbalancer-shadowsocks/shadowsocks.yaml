---
- name: install shadowsocks
  hosts: localhost
  vars:
    ansible_user: root
  tasks:

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes

    - name: install shadowsocks and dependencies
      ansible.builtin.apt:
        name:
          - shadowsocks-libev
          - openssl
          - curl
        state: present

    - name: Get latest v2ray-plugin release info
      ansible.builtin.uri:
        url: https://api.github.com/repos/teddysun/v2ray-plugin/releases/latest
        return_content: yes
        headers:
          Accept: application/vnd.github.v3+json
      register: v2ray_release

    - name: Set v2ray-plugin version fact
      ansible.builtin.set_fact:
        v2ray_version: "{{ (v2ray_release.json.tag_name | regex_replace('^v', '')) }}"

    - name: Download v2ray-plugin
      ansible.builtin.get_url:
        url: "https://github.com/teddysun/v2ray-plugin/releases/download/v{{ v2ray_version }}/v2ray-plugin_linux_amd64.tar.gz"
        dest: /tmp/v2ray-plugin.tar.gz
        mode: '0644'

    - name: Extract v2ray-plugin
      ansible.builtin.unarchive:
        src: /tmp/v2ray-plugin.tar.gz
        dest: /usr/local/bin
        remote_src: yes

    - name: Set executable permission on v2ray-plugin
      ansible.builtin.file:
        path: /usr/local/bin/v2ray-plugin
        mode: '0755'

    - name: Ensure SSL directory exists
      ansible.builtin.file:
        path: /etc/shadowsocks-libev/ssl
        state: directory
        mode: '0755'

    - name: Check if certificate and key already exist
      ansible.builtin.stat:
        path: /etc/shadowsocks-libev/ssl/server.crt
      register: cert_stat

    - name: Generate self-signed certificate and key
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -keyout /etc/shadowsocks-libev/ssl/server.key
        -out /etc/shadowsocks-libev/ssl/server.crt -days 365 -nodes
        -subj "/CN={{ dnsName }}"
      args:
        creates: /etc/shadowsocks-libev/ssl/server.crt
      when: not cert_stat.stat.exists

    - name: Ensure shadowsocks conf is set
      template: 
        src: templates/ss.config.json.j2 
        dest: /etc/shadowsocks-libev/config.json

    - name: Ensure shadowsocks is restarted
      service:  
        name: shadowsocks-libev
        state: restarted
        enabled: yes